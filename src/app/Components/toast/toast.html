@for (item of notification.messageToShow(); track item.id) {
  <div
    class="toast show shadow-lg align-items-center my-2"
    aria-live="assertive"
    aria-atomic="true"
    [ngClass]="{
      'bg-success': item.type === 'success',
      'bg-danger': item.type === 'error',
      'bg-warning': item.type === 'warning',
      'bg-info': item.type === 'info',
    }"
  >
    <div class="d-flex">
      <div
        class="toast-body"
        [innerText]="item.msg"
        [ngClass]="{
          'text-light': item.type === 'success' || item.type === 'error',
          'text-dark': item.type === 'warning' || item.type === 'info',
        }"
      ></div>
      <button
        type="button"
        class="btn-close me-2 m-auto"
        (click)="notification.removemsg(item.id)"
        [ngClass]="{
          'bg-light': item.type === 'success' || item.type === 'error',
          'bg-dark': item.type === 'warning' || item.type === 'info',
        }"
      ></button>
    </div>
  </div>
}
