<a [routerLink]="'/home/details/' + data.id" class="link m-2">
  <div class="card">
    <img src="{{data?.images?.[0]}}" class="card-img-top card-img" alt="..." />
    <div class="card-body m-2">
      <p class="small-text">{{data?.category}}</p>
      <h5 class="card-title w-75">{{data?.name}}</h5>
      <p class="small-text"><i class="bi bi-location"></i>{{data?.location}}</p>
      <div class="d-flex justify-content-between align-items-center">
        <p class="small-text">FUNDING PROGRESS</p>
        <p class="small-text precentage">85%</p>
      </div>
      <div class="progress-bar m-auto">
        <div class="progress"></div>
      </div>
      <hr />
      <div>
        <p class="small-text">MIN COMMITMENT</p>
        <p class="precentage">$ {{data?.unit_price}}</p>
      </div>
    </div>
  </div>
</a>
